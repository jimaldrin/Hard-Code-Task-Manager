<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f2" />
    <title>Tasker | Personal task manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>

  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-logo">
          <i data-lucide="calendar-check" class="logo-icon"></i>
          <span class="brand-name">Tasker</span>
        </div>
        <div>
          <button
            class="avatar"
            id="profile-button"
            type="button"
            aria-label="Open profile panel"
          >
            <span id="avatar-initials">JS</span>
          </button>
        </div>
      </header>

      <!-- Search Bar -->
      <button
        class="search-bar"
        id="search-button"
        type="button"
        aria-label="Search tasks"
      >
        <i data-lucide="search" aria-hidden="true"></i>
        <span>Search tasks</span>
      </button>

      <!-- CALENDAR -->

      <section class="calendar">
        <h2 id="month-year"></h2>

        <div class="week" id="week"></div>
      </section>

      <section class="focus-panel" aria-label="Today's progress">
        <div class="focus-copy">
          <p class="eyebrow">Daily Focus</p>
          <p class="task-count">
            <strong>
              <span id="completed-count">0</span>
              out of
              <span id="total-count">0</span>
              tasks complete
            </strong>
          </p>

          <p class="muted">a little progress adds up</p>
        </div>

        <div
          class="focus-ring"
          id="focus-ring"
          aria-label="50 percent complete"
        >
          <span>
            <span id="progress-percentage">50</span><small>%</small>
          </span>
        </div>
      </section>

      <button id="create-button">
        <i class="ph ph-plus"></i>
      </button>

      <!-- CREATE BUTTON -->
      <div class="modal hidden">
        <div class="modal-overlay hidden"></div>
        <form id="add-form" class="dialog-card">
          <div id="create-form-title">
            <div>
              <p class="dialog-label" id="new-task-text">New task</p>
              <h2 id="add-task-text">Add a task</h2>
            </div>
          </div>

          <label class="dialog-label" for="add-title"> Task name </label>
          <input
            type="text"
            name=""
            id="add-title"
            class="dialog-input"
            placeholder="Add task name..."
            required
          />

          <label class="dialog-label" for="add-note">
            Add note
            <span>(optional)</span>
          </label>
          <textarea
            name="note"
            id="add-note"
            class="dialog-input"
            maxlength="200"
            placeholder="Add a helpful detail..."
          ></textarea>

          <label for="add-category" class="dialog-label">Category</label>

          <div class="select-wrapper">
            <select class="dialog-input" id="add-category">
              <option value="Priority">Priority</option>
              <option value="General">General</option>
              <option value="Work">Work</option>
              <option value="Personal">Personal</option>
              <option value="Home">Home</option>
              <option value="Learning">Learning</option>
              <option value="Health">Health</option>
              <option value="Finance">Finance</option>
            </select>

            <i class="ph ph-caret-down"></i>
          </div>

          <div id="date-inputs">
            <div>
              <label for="add-date" class="dialog-label">Date created</label>
              <input
                type="date"
                name="date-created"
                id="date-created"
                class="dialog-input"
              />
            </div>

            <div>
              <label for="due-date" class="dialog-label">Due date</label>
              <input
                type="date"
                name="due-date"
                id="due-date"
                class="dialog-input"
              />
            </div>
          </div>
          <div class="dialog-actions">
            <button
              class="dialog-button secondary"
              id="close-button"
              type="button"
            >
              Cancel
            </button>
            <button class="dialog-button primary" type="submit" id="add-task">
              Add task
            </button>
          </div>
        </form>
      </div>
    </main>

    <!-- SCRIPTS -->
    <script type="module" src="js/main.js"></script>
  </body>
</html>
